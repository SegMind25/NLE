<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t">
  <title id="t">NLE — Native Linux Exe</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14203D"/>
      <stop offset="1" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="15" y="15" width="3" height="3" fill="#8FB4FF" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <g transform="translate(2 4) scale(0.7)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
    <g clip-path="url(#tile)">
      <rect x="16" y="16" width="480" height="480" fill="url(#dots)"/>
      <rect x="16" y="16" width="480" height="480" fill="url(#glow)"/>
    </g>
    <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="#35497F" stroke-opacity="0.75" stroke-width="3"/>
    <path d="M96 368V128h50l140 162V128h50v240h-50L146 206v162z" fill="url(#ink)"/>
    <rect x="356" y="332" width="64" height="36" rx="6" fill="#34D399"/>
  </g>
  <!-- wordmark: N L E and a cursor, drawn as paths so it never depends on a font -->
  <g transform="translate(380 52) scale(0.8)" fill="#EAF2FF">
    <path d="M0 240V0h50l140 162V0h50v240h-50L50 78v162z"/>
    <path transform="translate(274 0)" d="M0 0h50v190h120v50H0z"/>
    <path transform="translate(478 0)" d="M0 0h170v50H50v45h110v50H50v45h120v50H0z"/>
    <rect x="668" y="206" width="56" height="34" rx="5" fill="#34D399"/>
  </g>
  <text x="384" y="296" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="600" letter-spacing="7" fill="#9FB0CF">NATIVE LINUX EXE</text>
</svg>
