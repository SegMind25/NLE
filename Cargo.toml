[package]
name = "nle"
version = "0.1.0"
edition = "2021"
description = "NLE (Native Linux Exe): run Windows .exe files as native Linux programs. PE loader + reimplemented Win32/CRT libraries, no emulation"
keywords = ["windows", "pe", "elf", "compatibility", "exe"]
categories = ["command-line-utilities", "os::linux-apis"]
license = "MIT"
repository = "https://github.com/SegMind25/NLE"
readme = "README.md"
rust-version = "1.88"

[lib]
name = "nle"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "nle"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"

[profile.dev]
panic = "abort"
