name: release

on:
  push:
    tags: ["v*"]
  # builds the release for a version without pushing the tag by hand: the release creates the tag
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag to release, for example v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        run: |
          name="nle-${TAG}-linux-x86_64"
          mkdir -p "$name/lib/nle" "$name/bin" "$name/share/applications" "$name/share/icons/hicolor/256x256/apps"
          cp target/release/nle "$name/bin/"
          cp target/release/libnle.so "$name/lib/nle/"
          cp assets/nle.desktop "$name/share/applications/"
          cp assets/favicon.png "$name/share/icons/hicolor/256x256/apps/nle.png"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: nle-*.tar.gz
          generate_release_notes: true
