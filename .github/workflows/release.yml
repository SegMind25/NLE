name: release

# A release is built when a v* tag is pushed, and also when main gets a commit whose Cargo.toml version has no tag yet:
# the release then creates the tag at that commit. Later pushes to main with the same version do nothing.
#
# The binaries are built on AlmaLinux 8 (glibc 2.28) so they run on every distribution newer than that, then packaged as a
# tarball, .deb, .rpm, Arch package and AppImage (packaging/build.sh) and attached to the release.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag to release, for example v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists: nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "releasing $tag"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - name: Tools
        run: dnf install -y gcc binutils git tar gzip ca-certificates
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release
      - name: The binaries must run on glibc 2.28
        run: |
          max=$(objdump -T target/release/nle target/release/libnle.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "the binaries need glibc $max"
          newest=$(printf '%s\n' 2.28 "$max" | sort -V | tail -n 1)
          [ "$newest" = 2.28 ] || { echo "too new for RHEL 8, Debian 10 and Ubuntu 18.04"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            target/release/nle
            target/release/libnle.so

  package:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: target/release
      - name: Packages
        run: |
          sudo apt-get install -y desktop-file-utils
          chmod +x target/release/nle target/release/libnle.so
          tag="${{ needs.version.outputs.tag }}"
          NLE_VERSION="${tag#v}" packaging/build.sh
          ls -l dist
      - name: Try the .deb
        run: |
          sudo apt-get install -y ./dist/nle_*_amd64.deb
          nle --version
          nle doctor || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
