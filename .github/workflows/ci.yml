name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Windows cross toolchains for the test programs
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 xvfb libx11-dev libxtst6
      - name: Build
        run: cargo build --release
      - name: Test (unit tests and real Windows programs, run and relinked)
        run: cargo test --release
      - name: Doctor
        run: ./target/release/nle doctor
      - name: Examples
        run: |
          examples/build.sh
          ./target/release/nle examples/bin/sysinfo.exe
          ./target/release/nle relink examples/bin/sysinfo.exe -o /tmp/sysinfo-linux
          /tmp/sysinfo-linux/sysinfo
      - name: GUI example on the headless display
        run: |
          NLE_GUI=headless NLE_GUI_SCRIPT="wait 100; snapshot /tmp/window.png; close" ./target/release/nle examples/bin/window.exe
          test -s /tmp/window.png
      - name: Coverage list is up to date
        run: |
          ./target/release/nle coverage --markdown > /tmp/COVERAGE.md
          diff -u docs/COVERAGE.md /tmp/COVERAGE.md

  # the Linux packages build and work (the release workflow builds them again from an AlmaLinux 8 build)
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Packages
        run: |
          packaging/build.sh
          ls -l dist
      - name: Install the .deb
        run: |
          sudo apt-get install -y ./dist/nle_*_amd64.deb
          nle --version
          man -w nle || true
          test -f /usr/share/applications/nle.desktop
      - name: Run the AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          dist/NLE-*-x86_64.AppImage --version
          NLE_GUI=headless NLE_GUI_SCRIPT="wait 300; snapshot /tmp/launcher.png; close" dist/NLE-*-x86_64.AppImage
          test -s /tmp/launcher.png
      - name: Unpack the tarball
        run: |
          mkdir /tmp/t && tar -C /tmp/t -xzf dist/nle-v*-linux-x86_64.tar.gz
          /tmp/t/nle-v*-linux-x86_64/bin/nle --version
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
