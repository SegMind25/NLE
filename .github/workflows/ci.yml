name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Windows cross toolchains for the test programs
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build
        run: cargo build --release
      - name: Test (unit tests and real Windows programs, run and relinked)
        run: cargo test --release
      - name: Doctor
        run: ./target/release/anyexe doctor
      - name: Coverage list is up to date
        run: |
          ./target/release/anyexe coverage --markdown > /tmp/COVERAGE.md
          diff -u docs/COVERAGE.md /tmp/COVERAGE.md
